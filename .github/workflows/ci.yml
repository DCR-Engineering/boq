name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Validate quantity schema
        run: |
          python -c "
          import json, jsonschema
          s = json.load(open('schema/project_quantities.v1.json'))
          jsonschema.Draft202012Validator.check_schema(s)
          print('schema OK')
          "
      - name: Test
        run: pytest
